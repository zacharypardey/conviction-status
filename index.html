function tgap(s,TG){const cv=(s.tcurve||[]).filter(p=>p&&p[1]!=null&&p[0]>=5);if(!cv.length)return null;const N=cv[cv.length-1][0],t=cv[cv.length-1][1];const tg=TG.t/Math.sqrt(TG.n)*Math.sqrt(N);const d=t-tg;return {N,t,tg,d,k:tstate(t,d)};}   /* delta t: the strategy's latest t minus the gate path's t at the same window count (the green line of its t chart), 0 exactly on schedule for the gate; from the 5th settled window, like the chart */

function plain(r){r=String(r||'');let m;

if((m=r.match(/^ask only \(([^)]*)\)/)))return ['resting on the SELL side only · our fair is '+m[1].replace('-','')+' below the market','ok'];
if((m=r.match(/^no disagreement \(([^)]*)\)/)))return ['standing aside · not enough disagreement with the market ('+m[1]+')',''];
if(/^jump/.test(r))return ['paused · sudden price jump, quotes resume about 30 s after it calms','warn'];

if(/^no reference/.test(r))return ['waiting for Kalshi to publish the reference price','warn'];
if(/^composite stale/.test(r))return ['waiting for fresh exchange prices','warn'];
if(/^wind-down/.test(r))return ['winding down · no new quotes, positions ride to settlement',''];
if((m=r.match(/^open wait \((\d+)s in\)/)))return ['early in the window · not quoting yet ('+m[1]+' s in)',''];if(/^open wait/.test(r))return ['early in the window · not quoting yet',''];

<h1 class="exh">How this thing actually works</h1>
<p class="lede">A complete tour of Conviction: a set of trading strategies that bet on Kalshi's fifteen-minute Bitcoin contracts, tested side by side on paper before any of them touches real money. No jargon, no hand-waving. Read it and you will understand every number on this dashboard. The ones that should worry you right now are in Part 12, built from the same live data as the rest of the page.</p>

<h2 id="ex-part-1">Part 1 · The game<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Every fifteen minutes, Kalshi opens a new market. The price it uses is its own Bitcoin index: the <b>CF Benchmarks Real-Time Index (BRTI)</b>, built every second from the order books of several large exchanges. As a window opens, Kalshi averages BRTI over the sixty seconds just before and writes that number down. Call it <b>K</b>, the strike. At the close it averages BRTI over the window's last sixty seconds and compares the two.</p>
<p>If the ending average is above K, the market settles <b>YES</b>. If not, <b>NO</b>. Then it does the whole thing again. Ninety-six times a day, forever.</p>

<h2 id="ex-coupon">A contract is a coupon that pays one dollar<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Here is the part that trips everyone up, and it is the key to the whole thing. When you buy a YES contract, you are buying a coupon that pays exactly <b>\$1</b> if the answer turns out to be yes, and exactly <b>\$0</b> if it does not.</p>
<p>So what should such a coupon cost? If something has a 30% chance of happening, a coupon that pays \$1 when it happens is worth about 30 cents. Which means <b>the price is the probability</b>. A contract trading at 62¢ is the market announcing, out loud, "we think there is a 62% chance."</p>

<p>This is why the job is a <i>forecasting</i> job and not a gambling job. If we can say "that should be 66¢, not 62¢", and our numbers are closer to the truth than the market's on average, there is money in the gap. The whole model exists to produce that one number.</p>

<h2 id="ex-part-2">Part 2 · Two ways to play a market<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>You can play a market as a <b>gambler</b>: you want the price to move your way, so you buy and wait. Or you can play it as a <b>shop</b>: you stand there all day offering to buy at one price and sell at a slightly higher one, and you make your living on the difference.</p>
<p>The shop is called a <b>market maker</b>, and that is mostly what we are. The classic version posts an offer to buy a bit below what it thinks the contract is worth and an offer to sell a bit above. If someone hits either one, it pockets the gap. Part 4 explains why most of our strategies post only one of the two.</p>

<h2 id="ex-part-3">Part 3 · Where our opinion comes from<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>To disagree with the market you need a number of your own. Ours is built in three steps.</p>

<h3>Step one: a cleaner price than anyone else's</h3>
<p>We do not trust any single exchange. We read Bitcoin's price from <b>five</b> of them at once, several times a second, and take the middle value. One exchange freezing, lagging, or printing a bad tick cannot move our number. That middle value is what we call the <b>composite</b>. The five are the exchanges inside BRTI that publish a feed we can read, so the composite is our own copy of Kalshi's index.</p>
<p>Since 17 and 18 September most strategies no longer need the copy: they read BRTI itself, streamed live from Kalshi. Only <b>model</b> still prices on the composite, as the control that tells us whether reading BRTI directly helps.</p>

<h3>Step two: how far can it move?</h3>
<p>Over fifteen minutes Bitcoin wanders more or less at random. You cannot predict the direction, but you absolutely can measure how <i>far</i> it usually wanders, and that turns out to be the whole ballgame.</p>
<p>We measure the size of a typical one-second move from the last twenty minutes of prices. Call it <b>σ</b>, sigma. Then comes the single most useful fact in this entire field: randomness does not accumulate in a straight line, it accumulates along the <b>square root of time</b>.</p>
<div class="eq"><div class="fml"><i>&#963;</i><sub>&#964;</sub> = <i>&#963;</i> &#8730;<span class="rad"><i>&#964;</i></span></div>
<ul class="legend">
<li><b>σ</b> how big a typical one-second wiggle is</li>
<li><b>τ</b> how many seconds are left in the window</li>
<li><b>σ<sub>τ</sub></b> how far it could plausibly drift in the time remaining</li>
</ul></div>
<p>Wait four times as long and the price does not wander four times as far, it wanders only twice as far. This is why a contract can sit at 90¢ with two minutes left and be a perfectly fair price, while the same 90¢ with fourteen minutes left would be far too confident.</p>

<h3>Step three: turn distance into a probability</h3>
<p>Now we have everything. We know where Bitcoin is, we know the strike, and we know how far the price can realistically travel before the window closes. The chance of finishing above the strike is just the fraction of the bell curve that sits on the far side of it.</p>

<text x="200" y="124" font-size="10.5" fill="var(--muted)" text-anchor="middle">ignore the gap and every price we compute is off by it</text>
</svg>
<p>Five dollars sounded like nothing against a \$77,000 price. It was not nothing. Near the money, that gap was worth <b>two to five cents</b> of probability, and we are hunting for edges of exactly that size. A bot that forgets the basis will cheerfully sell YES all day at prices that are actually fair, and slowly bleed.</p>
<p>So we learn it. Every time a window opens we compare Kalshi's published strike with our own sixty-second average, and the difference is one observation of the basis. We keep a running average of the last several windows.</p>
<p>Strategies that read BRTI itself have no basis to learn; only model still learns it.</p>
<p class="aside"><b>This bit us for real.</b> On 12 September a freshly started bot had no basis yet, so it used zero. It sold YES at 49¢ while a correctly warmed copy of the same code, reading the same prices in the same second, said 67¢. The window settled YES. That is a real loss caused purely by a cold start, and it is why a bot now refuses to quote at all until it has seen at least two window openings. After a restart it replays its own recordings first, so those two openings are already there.</p>

<h2 id="ex-units">An aside on units, or why there is a whole Bitcoin price in the denominator<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Someone reading that formula carefully will object, and the objection is a good one. The top of the fraction is a <i>distance</i>: how many dollars we are above the strike, usually a handful. The bottom appears to contain the entire price of Bitcoin, about &#36;80,000. You cannot add those two things together. So why is it fine to multiply by them?</p>
<p>The answer is that <b>&#963; is not an amount of money. It is a percentage.</b></p>
<p>Look at how we measure it. We take the <i>logarithm</i> of the price before we measure anything, which means what we actually record is proportional moves, not dollar moves. To &#963;, a jump from &#36;76,700 to &#36;76,730 and a jump from &#36;10,000 to &#36;10,004 are the same size, because both are about four hundredths of one percent. There are no dollars anywhere inside &#963;. Its only unit is <b>per square root of a second</b>, and that comes from the square-root-of-time rule, not from money.</p>
<p>So &#963;&#8730;&#964; is a bare fraction. A percentage of nothing is nothing, and <b>S is what turns that percentage into money.</b> It is a multiplier, not an addend. Once you multiply, the bottom of the fraction is in dollars, the top is in dollars, and they cancel.</p>
<svg class="dg" viewBox="0 0 400 196" role="img" aria-label="The units cancel in the z formula, leaving a pure number">
<text x="140" y="44" font-size="15" fill="var(--ink)" text-anchor="middle" font-style="italic">S + b &#8722; K</text>
<text x="140" y="61" font-size="10.5" fill="var(--good)" text-anchor="middle">dollars</text>
<line x1="52" y1="73" x2="228" y2="73" stroke="var(--ink)" stroke-width="1.6"/>
<text x="140" y="97" font-size="15" fill="var(--ink)" text-anchor="middle" font-style="italic">&#963; &#183; S &#183; &#8730;&#964;</text>
<text x="140" y="114" font-size="10.5" fill="var(--muted)" text-anchor="middle">1/&#8730;s &#183; dollars &#183; &#8730;s</text>
<text x="140" y="130" font-size="10.5" fill="var(--good)" text-anchor="middle">= dollars</text>
<path d="M240 84 L286 84" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#exc)"/>
<text x="344" y="80" font-size="14" fill="var(--accent)" text-anchor="middle" font-weight="700">z</text>
<text x="344" y="96" font-size="10" fill="var(--muted)" text-anchor="middle">a pure number</text>
<text x="200" y="162" font-size="11" fill="var(--ink)" text-anchor="middle">the square roots of seconds cancel, then the dollars cancel</text>
<text x="200" y="178" font-size="10.5" fill="var(--muted)" text-anchor="middle">what survives is "how many typical moves from the strike are we?"</text>
<defs><marker id="exc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 1 L6 3.5 L0 6" fill="var(--ink)"/></marker></defs>
</svg>
<p class="cap">Both halves are in dollars, so the ratio is a bare number, which is exactly what a bell curve will accept.</p>
<p>Here is a real row the bot recorded, with about four minutes left in a window:</p>
<div class="eq"><div class="fml">&#963; &#8730;&#964; = 1.4&#215;10<sup>&#8722;5</sup> &#215; &#8730;195 = 0.000195</div>
<div class="fml">&#215; S = 0.000195 &#215; &#36;76,732 = &#36;14.99</div>
<ul class="legend">
<li>the fraction says Bitcoin could plausibly drift about <b>0.0195%</b> in the time remaining</li>
<li>multiplied by the price, that is about <b>&#36;15</b>, and the bot recorded &#36;15.44 once the calibration and the basis error were folded in</li>
<li>we were &#36;0.78 below the strike, so z = &#8722;0.78 / 15.44 = &#8722;0.05, and the model priced it at 49.5&#162;</li>
</ul></div>
<p>Now try the other version. Add instead of multiply, and the denominator becomes &#36;76,732 + 0.000195, which is &#36;76,732. The volatility has simply vanished into rounding. Every z collapses to about one hundred-thousandth, and every market on every day prices at <b>49.9996&#162;</b>, forever, no matter how far from the strike we sit or how little time is left. The model would have no opinion about anything.</p>
<p class="aside"><b>The instinct was right, the target was wrong.</b> Never add a price to a price-change: that really would be a bug, and it is the kind that hides for months. Here S is not a price being added to a distance, it is the exchange rate between percentages and dollars. The same thing is going on, quietly, every time someone says "a 2% move" and you reach for a calculator.</p>
<p>One more check that the units are honest: the real denominator also carries the <b>basis error</b>, the leftover disagreement between our index and Kalshi's, and it is added in quadrature. That is only a legal thing to do because it is measured in dollars too. If &#963;&#8730;&#964; had been left as a bare fraction, there would have been nothing to add it to.</p>

<h3>Every symbol on this page, and what it is measured in</h3>
<p>Every equation here passes the same test: both sides of the equals sign carry the same units. A formula that fails that test is wrong no matter how convincing its output looks.</p>

<p class="aside"><b>A warning about one letter.</b> &#963; appears in two different formulas on this page meaning two different things, which is a genuine trap and not our invention &#8212; it is how both fields write it. In the probability formula &#963; is a <i>proportional price move per square root of a second</i>, with no dollars in it. In the Kelly formula &#963;<sup>2</sup> is the <i>variance of our per-window profit</i>, measured in dollars squared. They are unrelated quantities that happen to share a symbol. If you ever find yourself substituting one into the other, the units will stop you, which is the entire reason to check them.</p>
<h2 id="ex-random">Is Bitcoin actually random? What the model does and does not assume<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>If the price really were a coin flip, none of the things traders stare at all day would mean anything. And yet anyone can pull up a chart and see the 50-day average sloping upward, or a moving-average crossover, or a pattern that has resolved the same way a dozen times before. So which is it?</p>
<p>Both, and the reason is that <b>the claim we are making is far narrower than "Bitcoin is random".</b> We are not saying the price has no trend. We are saying that <i>over the next fifteen minutes</i> we cannot predict the direction well enough to move a price by a single cent. That is a much smaller claim, and it is the only one the model needs.</p>

<h3>Why direction stops mattering when the clock is short</h3>
<p>Here is the whole argument in one line. <b>A trend accumulates with time. Randomness accumulates with the square root of time.</b> Wait twice as long and the trend gets twice as big, but the noise only gets 1.41 times bigger. So trends win eventually, and lose badly at the start.</p>

<h3>What we never assumed: four places the model leaves the textbook</h3>
<p>"Random walk" in a textbook usually comes bundled with two extra assumptions that are plainly false for Bitcoin: that the amount of movement is constant, and that extreme moves are rare. We use neither.</p>
<p><b>One. Volatility is not a constant, and we re-measure it every second.</b> The width of our bell curve comes from the last twenty minutes of actual price movement, recomputed continuously. Quiet markets get a narrow curve, wild ones a wide curve.</p>

<p class="cap">Ten real hours of our own volatility estimate. Between the calmest minute and the wildest one there is a factor of 16.5.</p>
<p>That picture is not noise, it is structure, and it has a name: <b>volatility clustering</b>. Calm begets calm and violence begets violence. We measured how long it persists on our own data: one minute later the estimate is 98% correlated with itself, five minutes later 90%, half an hour later 26%, and after four hours the relationship has gone. That is precisely why a twenty-minute trailing window is the right length to look back: long enough to be stable, short enough to still be about now.</p>
<p><b>Two. The tails are fatter than a bell curve.</b> A true bell curve says a five-standard-deviation move happens roughly once every few million draws. In crypto they turn up in an afternoon. We use a Student-t distribution with eight degrees of freedom instead, which keeps the same middle but makes the extremes far more likely.</p>

<p class="cap">Same shape where most of the action is, much heavier ends. Using the dashed curve would make us confidently sell things that then happen.</p>
<p><b>Three. Real jumps are not in the distribution at all, so we stop trading instead.</b> Some moves are not "a big draw from the distribution", they are a different thing entirely: a liquidation cascade, a headline, an exchange breaking. No width setting handles those; the honest response is to stand aside. A detector called <b>Lee-Mykland</b> runs continuously, comparing the newest one-second move with the typical size of the moves immediately around it. When one is far too large to belong, quoting is vetoed and stays vetoed while the flag decays away. You will see this on the dashboard as "paused · sudden price jump".</p>
<p><b>Four. The bell curve itself gets marked for accuracy.</b> Even after all of the above, the shape can be systematically slightly wrong, and wrong in different ways depending on how much time is left. So the model keeps a correction per time band, fitted from how its past probabilities actually turned out, and applies it before quoting. A model that checks its own homework.</p>
<p class="aside">So the only textbook assumption we actually lean on is <b>zero drift over fifteen minutes</b>. Constant volatility, thin tails, no jumps: we reject all three explicitly, with machinery for each.</p>

<h3>So could we add a moving average, an RSI, a chart pattern?</h3>
<p>We could, and here is the bar it would have to clear. <b>We are not trying to beat zero. We are trying to beat the Kalshi price.</b> We only make money when we disagree with the market and turn out to be right, so a signal is worth nothing to us unless it contains something the market has missed. A 50-day moving average is the single most widely computed number in finance. Whatever it knows is already in the price.</p>
<p>And we have tried harder things than that. Every candidate goes through the same test: fit it on the first 60% of the windows, then score it on the last 40% that it has never seen. Four attempts so far, all of them more specialised than a classic indicator:</p>
<div class="wrap"><table class="stack"><tr><th>what we tried</th><th>result out of sample</th><th>shipped?</th></tr>
<tr><td class="rh">lead-lag from perpetual futures</td><td data-label="result">R&#178; of &#8722;0.006, worse than nothing</td><td data-label="shipped">no</td></tr>
<tr><td class="rh">multi-horizon volatility forecast</td><td data-label="result">error 0.598 against 0.579 for a plain trailing average</td><td data-label="shipped">no</td></tr>
<tr><td class="rh">refitting the fat-tail parameter</td><td data-label="result">0.6301 against 0.6215 for the default</td><td data-label="shipped">no</td></tr>
<tr><td class="rh">order-flow imbalance</td><td data-label="result">R&#178; of 0.001</td><td data-label="shipped">no, but left wired in</td></tr>
</table></div>
<p>Four for four, all failures. That is not an argument that nothing could ever work. It is an argument that the graveyard is well populated, that the test is unsentimental, and that anything which does survive it will have earned the right to price real money.</p>
<p class="aside"><b>What we can show, and what did not hold up.</b> Early on, over 147 windows, the model was on the correct side of its 2¢-or-more disagreements with the market 62% of the time. That looked like our most encouraging number. It did not hold up.</p>
<p class="aside">Over 632 windows (18 September), our fair value added no reliable information beyond Kalshi's own price. Next to the market's mid it never earned a significant weight, and in the last five minutes it was clearly worse than the mid. Over 625 windows (19 September), the underdogs our fair value liked by 2¢ or more, 10 to 5 minutes before the close, won 27.8% of the time against the 31.8% their price implied. The market is a hard forecaster to beat. Any edge has to be proven by a strategy's own results, window by window (Part 8), not assumed from the model.</p>
<h2 id="ex-part-4">Part 4 · When we actually trade<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Now we have our number and the market has its number. The obvious move is to quote both sides all the time and collect the spread. We used to do exactly that. It is worse than it sounds.</p>
<p>If we post a buy and a sell around a price we secretly believe is wrong, then one of those two orders is a gift to whoever takes it. We get filled on the bad side precisely when we are wrong, which is the worst possible time.</p>

<h3>Rule one: only quote the side you actually believe in</h3>
<p>So we stopped quoting both sides. We compare our fair value with the market's middle price. If they are within <b>two cents</b> of each other, we have no opinion worth acting on and we post nothing at all. If we are more than two cents apart, we post on <b>one side only</b>: the side that profits if we are right.</p>

<p>The rule rests on a measurement. In the 12 September fills study, fills where the model agreed with the market lost 3.5¢ a contract once the price had moved, and fills on the side of a real disagreement made 2.5¢. Most of the time the dashboard will show a strategy saying <b>"standing aside"</b>. That is the strategy working, not the strategy sleeping.</p>

<h3>Rule two: when the gap is big, stop waiting</h3>
<p>Posting an order and waiting is free, but it only works if someone comes to you. When the disagreement gets <i>large</i>, five to eight cents, waiting is the wrong instinct: an edge that big will usually be gone before anyone wanders over.</p>
<p>So a separate strategy crosses the spread and takes the price immediately. It pays a fee to do it, so it only fires on gaps big enough to cover the fee several times over, and at most once per window in each of three time bands: early, middle and late. One strategy is patient, the other is opportunistic, and they are accounted for separately so we can see which one actually earns its keep. Since 13 September the taker has run as a shadow: it keeps its own paper account and its own t-stat, but risks none of the pool's money, because it lost 3.95¢ a contract over its first 101 fills.</p>

<h3>Rule three, on trial: the flat strategy stops adding inventory in the last five minutes</h3>
<p>The <b>flat</b> strategy is the index strategy with one line changed. Index is model's rules priced on BRTI; see the table at the end of this part. Flat reads the same fair value, applies the same two-cent rule, posts on the same side at the same price and size, obeys the same caps and brakes, and runs on its own $5,000 of the same pool. For the first ten minutes of every window the two are indistinguishable. The one difference: <b>inside the last five minutes it will not add to its position.</b></p>
<p>Precisely: with five minutes left (the dashboard calls this τ, the seconds to the close, and the rule starts at τ = 300) the size the strategy may post on each side becomes "whatever brings the position closer to zero, and nothing more". Holding 40 contracts long, it may still post a sell for up to 40, and a buy for zero. Holding nothing, it posts nothing at all and stands aside until the window settles. It does not chase a flat position - it never crosses the spread to get out - it simply stops taking on inventory that would have to be carried into settlement. The dashboard shows this as the reason <b>"late cap"</b> next to the flat strategy's quote.</p>

<p><b>Why this one change.</b> On 16 September we split every window's result for the model strategy into two pieces: what the spread earned on fills that were closed out inside the window, and what the inventory still held at the close made or lost when the window settled. Over 274 windows the first piece was <b>+$3,807</b> (t = +4.42) and the second was <b>−$2,795</b> (t = −2.04). The bot was being paid for quoting and charged for holding. Inventory taken late is the most expensive kind: with a minute or two left the outcome is nearly decided, whoever hits our quote can mostly see that already, and there is no time left to trade back out.</p>
<p><b>Why a separate strategy rather than just changing the base.</b> The two run side by side on the same windows, so "did the change help?" is answered by the <b>difference</b> in their results, window by window - and that difference is far less noisy than either strategy's total, because everything the two share (the price moves, every fill in the first ten minutes) cancels out. In the first flat-against-model run, a strategy's own result swung about $100 a window and the difference between the two about $47. That is the paired t of Part 8, and it converges roughly five times faster than either strategy's absolute edge would. Flat replaced the earlier "wide" strategy, whose results turned out to be 0.89-correlated with model's: a duplicate that could never have told us anything new.</p>
<p>What to watch: flat's row in the performance table, and its paired t against index (Part 8). The rule was written before its data: it passes at t ≥ 2 by 200 windows and is dropped at t ≤ −1 after 100. Until then the two are one experiment, not a winner and a loser. If flat wins, the late cap becomes part of the base strategy. If it loses, we have learned, cheaply and on paper, that the settlement losses were the price of fills worth having.</p>
<p class="aside">One wrinkle on a real exchange account: two strategies posting the same price on one account are a single spot in the exchange's queue, so on the demo they take turns being first in line and share the fills between them. In paper, since 18 September, each strategy is simulated as if it traded alone and takes every trade on its own. That keeps each strategy's result its own, but it means the pool's total counts some trades more than once. Read the pool as a sum of separate experiments, not as one account's money.</p>

<h3 id="ex-roster">The strategies running now<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h3>
<p>Every strategy is a one-line change to another, so each is judged by its paired t against the strategy it changes (Part 8). The rule is written before any of its data: it passes at t ≥ 2 by 200 windows, and is dropped at t ≤ −1 after 100. All of them skip the first minute of every window, when the price is jumpiest.</p>

<h2 id="ex-part-5">Part 5 · The fee, and why its shape matters<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Kalshi charges whoever trades immediately a fee with an unusual shape. It is not a flat percentage. It depends on the price.</p>

<li>charged per contract, only when we take rather than post</li>

<p>The shape is a warning label. The fee is largest at 50¢, which is where the outcome is most uncertain and where an edge is hardest to prove. It shrinks toward the ends, where the outcome is nearly decided. Anyone paying to take a coin-flip position is paying the most for the least reliable opinion. Every strategy except the taker only ever waits in the book, so they pay nothing at all.</p>

<h2 id="ex-part-6">Part 6 · The brakes<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>A strategy that makes money on average can still destroy you on a bad afternoon. Four independent brakes sit between the model and the account, and each one can stop the machine without the others.</p>
<svg class="dg" viewBox="0 0 400 236" role="img" aria-label="Four layers of risk control">

<p>There is a fifth, subtler brake. After every fill we check where the price went in the following ten seconds. If our fills are consistently followed by the market moving against us, it means the people trading with us know something we do not, and we widen our spread or stop for ten minutes. This measurement is called a <b>markout</b>, and it is the earliest honest warning that an edge has stopped being an edge.</p>
<p class="aside"><b>The two daily-loss brakes are on only for real money</b> (half size at −5% of the pool for the day, stop at −10%). Paper and the sandbox switched them off on 16 September: a halt there protects no money and only throws away windows the statistics need. One gap we know about: after a restart, the markout brake starts from nothing and cannot act until 25 new fills arrive. The fix is on the to-do list (Part 13).</p>

<h2 id="ex-part-7">Part 7 · How much to bet<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Suppose the machine really does have an edge. How much should it put behind each trade? Bet too little and you waste the edge. Bet too much and an ordinary losing streak wipes you out before the average has a chance to show up.</p>
<p>There is a known answer, from a 1956 paper by John Kelly at Bell Labs. Bet in proportion to your edge and in inverse proportion to your risk.</p>
<div class="eq"><div class="fml"><i>f</i><sup>*</sup> = <span class="frac"><span><i>&#956;</i><sub>eff</sub>&#8202;<i>B</i></span><span><i>&#963;</i><sup>2</sup></span></span></div><div class="fml"><i>&#956;</i><sub>eff</sub> = max(0, <i>&#956;</i> &#8722; <i>SE</i>)</div>
<ul class="legend">
<li><b>μ</b> our average profit per window so far</li>
<li><b>SE</b> how unreliable that average still is, given how few windows we have seen</li>
<li><b>μ<sub>eff</sub></b> the edge after subtracting one full unit of our own uncertainty</li>
<li><b>σ²</b> how violently results swing around from window to window</li>
<li><b>B</b> the money actually at risk</li>
</ul></div>
<p>That subtraction is the important part and it is deliberately harsh. We do not size on the edge we measured. We size on the edge we measured <i>minus our uncertainty about it</i>. Early in a run, when we have seen only a handful of windows, the uncertainty swallows the whole average and the formula says: no change, stay at base size. Only a result that survives its own error bar is allowed to increase our bet.</p>
<p>Then we cut that in half again (half-Kelly, because full Kelly is famously wild), refuse to move more than 25% in a single day, and never go below a quarter of base size or above twice it. When a strategy does earn its way up, half of the profit goes back to work and half is banked and never risked again.</p>
<p class="aside"><b>Where this stands today.</b> The rule now waits for 1,000 settled windows before it moves anything. At 40 windows, the old setting, our uncertainty about the edge was wider than the whole range the multiplier is allowed to move in. In paper, every strategy also deliberately quotes the same size, so a comparison between two strategies measures their rules, not their bankrolls. Every size multiplier on this dashboard reads ×1.00: we have not yet earned the right to bet more.</p>

<h2 id="ex-part-8">Part 8 · How we know whether any of this works<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Here is the trap, and almost everyone falls into it. A strategy makes money for three hours. Is it good?</p>
<p>You cannot answer that from the profit. You need to know how much the results <i>bounce around</i>. Making \$100 a window when a typical window swings by \$20 is a machine. Making \$100 a window when a typical window swings by \$430 is a coin that landed well.</p>

<p>Notice the √n underneath. Doubling your evidence does not halve your doubt, it only reduces it by about 30%. This is why our go-live gate demands <b>200 settled windows</b>, roughly two days of trading, and a <b>t above 2</b>. It is also why a great morning means very little.</p>
<p class="aside"><b>A live example of why this matters.</b> At 16:20 one afternoon the simulation showed a t of 2.53 and looked unambiguously good. Ninety minutes later, after two more windows, the same number read <b>1.02</b>. Nothing broke. The strategy did not change. There was simply never as much evidence as the first number implied.</p>

<h3>Reading the t-stat properly</h3>
<p>The t-stat answers one narrow question: <b>if this strategy had no edge at all, how unusual would a result this good be?</b> To read it you need to know exactly what goes into it, so here is every symbol, defined once.</p>
<div class="eq">
<ul class="legend">
<li><b>r<sub>1</sub>, r<sub>2</sub>, … r<sub>n</sub></b> — the result of each settled window, in dollars: what that one 15-minute window did to the account. A window in which the strategy made no trades counts as \$0.</li>
<li><b>n</b> — how many settled windows there are so far.</li>
<li><b>μ</b> (mu) — the <b>average result per window</b>: (r<sub>1</sub> + r<sub>2</sub> + … + r<sub>n</sub>) ÷ n. One number for the whole run. This is the top of the fraction.</li>
<li><b>s</b> — the <b>standard deviation of the single-window results</b>: how far one window typically lands from μ. In symbols, s = √( Σ(r<sub>i</sub> − μ)² ÷ (n − 1) ). Dividing by n − 1 rather than n is the honest choice for a sample; it makes s slightly larger, and t slightly smaller, when evidence is thin.</li>
<li><b>SE</b> — the <b>standard error of the average</b>, which we call the <b>wobble</b>: SE = s ÷ √n. How far μ itself would typically land from the true average if we could re-run these n windows again. This is the bottom of the fraction, and the next section is entirely about it.</li>
<li><b>t</b> = μ ÷ SE = μ ÷ (s ÷ √n). <b>How many wobbles the average sits above zero.</b></li>
</ul></div>
<p>Two different spreads appear in that list, and keeping them apart is the whole trick. <b>s</b> describes <i>single windows</i>: pick one window at random and it lands about s away from μ. <b>SE</b> describes <i>the average of n windows</i>: run the whole batch again and the new average lands about SE away from the old one. s is about the windows; SE is about μ.</p>

<p class="cap">t is a count. One wobble is SE = s ÷ √n; t asks how many of them fit between zero and the average μ.</p>
<p class="aside"><b>What it is not.</b> It is not the probability that the strategy works, and it is not the probability that the result is luck. It tells you how often luck <i>on its own</i> would produce a number this high. Those sound identical and are not: if nearly every idea you try is worthless, most of the ideas that clear the bar are still worthless — they are simply the lucky ones.</p>

<h3>The bottom of the fraction, piece by piece</h3>
<p>The top of t is just μ, the average profit per window. The bottom, SE, is built from s and n, so here they are one at a time, each on real data.</p>
<p><b>Step 1 — s, the spread of single windows.</b> Take every settled window from an earlier 274-window run and plot what each one made or lost. That scatter is what s measures: the typical distance from one window to the average.</p>

<p class="cap">Every dot is one real 15-minute window from an earlier 274-window run — one dot per window, plotted by what that window made or lost. 155 windows had no trades and sit at \$0; the rest scatter widely. <b>s</b> is the typical distance from a dot to the average line.</p>
<p><b>Step 2 — from one window to the average of many.</b> Now a thought experiment. Instead of one window, take a batch of 100 windows and compute their average. Then imagine doing that again with a fresh batch of 100, and again, and again. Each batch gives one average, and those averages do not all agree — but they disagree far less than single windows do, because inside each batch the good windows and the bad ones partly cancel. The spread of those batch averages is the standard error. For a batch of n windows it is exactly:</p>
<div class="eq"><div class="fml">SE = <span class="frac"><span><i>s</i></span><span>&#8730;<span class="rad"><i>n</i></span></span></span></div>
<ul class="legend">
<li>a single window wobbles by <b>s</b> (≈ \$103 in this run)</li>
<li>the average of 100 windows wobbles by <b>s ÷ √100 = s ÷ 10</b> (≈ \$10.30)</li>
<li>the average of 274 windows wobbles by <b>s ÷ √274 = s ÷ 16.6</b> (≈ \$6.22)</li>
<li>the average of 3,100 windows wobbles by <b>s ÷ √3,100 = s ÷ 55.7</b> (≈ \$1.85)</li>
</ul></div>
<p>The diagram below shows both spreads on the same dollar axis. The top row is single windows — one dot per window. The bottom row is averages of 100 windows — one dot per imagined re-run of a 100-window batch, built by resampling the real windows. Same data, two very different spreads.</p>

<h3>Where luck lands</h3>
<p>Imagine thousands of strategies that truly make nothing. Each one produces an average, a wobble and a t. Their t-stats pile up around zero in a bell shape, and the part of the bell beyond any given value is the chance that a no-edge strategy reaches it by luck.</p>

<p>That sliver is what the t-stat gives you. It is not the chance that <i>your</i> strategy is worthless; that depends on how many of the ideas you try are worthless to begin with.</p>

<p class="cap">An illustration with round numbers, not a measurement. When most ideas are worthless, even a strict bar lets some through, so a passing t is a reason to keep watching, not a verdict.</p>

<h3>One tail or two?</h3>
<p>The t-stat is just a number; "tails" describe how you read it. A <b>two-tailed</b> reading asks "is the average different from zero in either direction?" and counts luck on both sides of the bell. A <b>one-tailed</b> reading asks "is it above zero?" and counts only the right side. We only run a strategy because we think it makes money, so our question is one-sided and <b>we read the t-stat one-tailed</b>. That makes any given t look roughly twice as convincing as a two-tailed reading would — which is exactly why the bar stays at 2 and does not drift lower.</p>

<p class="cap">Same curve, same t of 2. We only care about making money, so we look at the right tail alone. Counting both tails doubles the area, which is why a two-tailed reading makes the same t look half as convincing.</p>
<p>The table shows, for a strategy with <b>no edge at all</b>, how often luck alone produces a t at least this high. With few windows, s itself is uncertain, so the bell has fatter tails and the same t is less convincing early on.</p>

<p class="cap">With only 10 windows we are also unsure how big the swing is, so the curve of luck is flatter with fatter tails. More of it spills past 2, and the same t deserves less trust early on.</p>

<h3>Why a t of 2 is less safe than that table makes it look</h3>
<p><b>We look every day.</b> The 2.3% assumes you look once, at the end. We look constantly. We simulated a strategy with no edge, checked once a day: its t touched 2 at least once in <b>8% of 7-day runs, 13% of 30-day runs and 18% of 90-day runs</b>. So a t that <i>touched</i> 2 means far less than one that <i>stays</i> above it.</p>

<p class="cap">Small odds add up. Each worthless idea has only a 2.3% chance of fooling us, but test twelve and the chance that at least one does is about one in four.</p>
<p><b>Our windows are not tidy coin flips.</b> Single windows have swung from −\$514 to +\$730, and in one run the five best windows alone made more than the entire run's profit. A few windows like that can drag μ, and so t, up or down on their own. In simulations using our real window shapes, a no-edge strategy fell below −2 at some point in 30 days <b>17.5%</b> of the time, against 12.4% for tidy data. Windows on the same day also share a market mood, so they are less independent than the formula assumes — which makes every t on this page somewhat more flattering than the truth.</p>

<p class="cap">Real results are not a neat bell. Most windows are small, and a few are huge in either direction. Those few can push t up or down on their own, so the textbook odds in the tables above are a little too comforting for us.</p>

<h3>What happens over time</h3>
<p><b>If the edge is real, t grows with the square root of time.</b> Put the formula together: t = μ ÷ (s ÷ √n) = (μ ÷ s) × √n. For a strategy with a fixed true edge, μ ÷ s settles down to a constant, so t is expected to climb like √n — four times the windows, twice the t. Take a small but genuinely real edge the size the simulation once showed, \$3.69 a window on a \$103 swing, at 96 windows a day:</p>
<div class="wrap"><table class="stack"><tr><th>after</th><th class="num">expected t</th><th class="num">chance it reads 2 or more</th></tr>
<tr><td class="rh">1 day</td><td class="num" data-label="expected t">0.35</td><td class="num" data-label="chance it reads 2 or more">5%</td></tr>
<tr><td class="rh">1 week</td><td class="num" data-label="expected t">0.93</td><td class="num" data-label="chance it reads 2 or more">14%</td></tr>
<tr><td class="rh">2 weeks</td><td class="num" data-label="expected t">1.31</td><td class="num" data-label="chance it reads 2 or more">25%</td></tr>
<tr><td class="rh">30 days</td><td class="num" data-label="expected t">1.92</td><td class="num" data-label="chance it reads 2 or more">47%</td></tr>
<tr><td class="rh">60 days</td><td class="num" data-label="expected t">2.72</td><td class="num" data-label="chance it reads 2 or more">76%</td></tr>
<tr><td class="rh">90 days</td><td class="num" data-label="expected t">3.33</td><td class="num" data-label="chance it reads 2 or more">91%</td></tr>
</table></div>
<p>Even if that edge were completely real, a month of running would leave you with only a coin flip's chance of seeing t above 2. A small edge is slow to prove, and patience is not optional.</p>
<p><b>If there is no edge, t does not grow.</b> μ ÷ s hovers around zero, so multiplying it by √n gets you nowhere: t wanders around zero and occasionally strays toward ±2 by chance, then drifts back. So the shape over time is the tell: a real edge climbs roughly like the square root of time and <i>stays</i> up; luck spikes and falls back, like the 2.53 that became 1.02 above.</p>

<h3>The paired t: comparing two strategies</h3>
<p>When two strategies trade the same windows, as every strategy and the one it changes do, we do not ask whether each one beats zero. We ask whether one beats the other, window by window. For each window i, take the difference d<sub>i</sub> = r<sub>i</sub>(flat) − r<sub>i</sub>(model), then compute exactly the same statistics on the differences: μ<sub>d</sub> is their average, s<sub>d</sub> their spread, and t<sub>d</sub> = μ<sub>d</sub> ÷ (s<sub>d</sub> ÷ √n).</p>
<p>The reason this is powerful is s<sub>d</sub>. Most of the market's noise hits both strategies at once — a wild window is wild for both — so it cancels in the difference, and s<sub>d</sub> is far smaller than either strategy's own s (about \$59 a window in the first flat-against-model run, against roughly \$103 for one strategy alone). A smaller s means a smaller wobble, so a real gap shows up much sooner. If flat were truly \$10 a window better, t<sub>d</sub> would typically read about 1.7 after one day, 2.9 after three and 4.4 after a week.</p>

<h2 id="ex-part-10">Part 10 · What we honestly do not know yet<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>Two questions cannot be answered by either of the first two worlds, and they are the two that decide whether any of this works.</p>
<p><b>Will our orders actually get filled?</b> The simulation assumes that when the market trades at our price, we get a share of it. In an early check over four windows run side by side, the simulation filled 2,932 contracts and the sandbox 32. The sandbox is thin because almost nobody trades there, and the simulation may be generous. The truth is somewhere between, and only real money in the real order book will find it.</p>
<p><b>Do the people trading with us know more than we do?</b> In a simulation nobody is trying to beat you. In the sandbox almost nobody is there at all. On the real exchange, everyone who takes our quote chose to. If our fills are systematically followed by the price moving against us, the edge is an illusion, and the markout tiles are where that will show up first. Part 12 shows what they say right now.</p>
<p class="aside">This is why the first real-money day is deliberately small. Not because we expect it to fail, but because the two biggest unknowns can only be measured by doing it, and the cost of measuring should be the smallest number that still produces a real answer.</p>

<h2 id="ex-part-11">Part 11 · How much could middle make at scale?<a class="toc-up" href="#ex-toc" title="Back to the contents">&#8593; contents</a></h2>
<p>A study on 19 September 2026 asked one question: <b>if middle's edge is real, how much could it earn in a month with unlimited money?</b> The answer is that money is not the limit. The limit is how many contracts actually trade at the price where middle waits, and how much of that trading ever reaches our order.</p>
<p class="aside"><b>One condition hangs over every dollar in this part: the edge has to be real.</b> In the current run, middle made about 9¢ a contract (73 windows). Over every window we have recorded it made 1.7¢ (735 windows). In the first half of that history it made nothing: −0.1¢ over 367 windows, against +3.6¢ over the later 368. Part 8 explains why a short run can mislead. Middle's 200-window test decides whether scaling is even on the table.</p>

<h3>The pieces</h3>
<p>Same rule as the glossary in the aside on units: both sides of each equation carry the same units.</p>
<div class="wrap"><table class="stack"><tr><th>symbol</th><th>units</th><th>what it is</th></tr>
<tr><td class="rh">window</td><td data-label="units">15 minutes</td><td data-label="what it is">one contract on whether Bitcoin ends above its strike. There are 96 a day.</td></tr>
<tr><td class="rh">band</td><td data-label="units">5 minutes</td><td data-label="what it is">the stretch middle trades, from 10 to 5 minutes before the close. It holds what it bought until settlement.</td></tr>
<tr><td class="rh"><i>N</i></td><td data-label="units">windows per month</td><td data-label="what it is">96 a day &#215; 30 days = 2,880</td></tr>
<tr><td class="rh"><i>k</i></td><td data-label="units">none</td><td data-label="what it is">the size multiple: how many times today's size. Today <i>k</i> = 1, meaning orders of 100 contracts and at most 400 held.</td></tr>
<tr><td class="rh"><i>C</i>(<i>k</i>)</td><td data-label="units">contracts per window</td><td data-label="what it is">how many contracts middle gets filled in one window at size <i>k</i></td></tr>
<tr><td class="rh"><i>e</i>(<i>k</i>)</td><td data-label="units">dollars per contract (shown in cents)</td><td data-label="what it is">the edge per contract: the average profit on each filled contract once the window settles, after fees</td></tr>
<tr><td class="rh"><i>&#960;</i>(<i>k</i>)</td><td data-label="units">dollars per window</td><td data-label="what it is">profit per window</td></tr>
<tr><td class="rh"><i>&#928;</i>(<i>k</i>)</td><td data-label="units">dollars per month</td><td data-label="what it is">profit per month</td></tr>
<tr><td class="rh"><i>V</i></td><td data-label="units">contracts per window</td><td data-label="what it is">addressable volume: contracts that traded at or through the price middle was waiting at, while it waited</td></tr>
<tr><td class="rh"><i>Q</i></td><td data-label="units">contracts</td><td data-label="what it is">the queue ahead: contracts already waiting at that price when middle arrives. Kalshi fills one price first come, first served, so a bigger order does not jump the line.</td></tr>
<tr><td class="rh"><i>R</i></td><td data-label="units">contracts per window</td><td data-label="what it is">reachable volume: the part of <i>V</i> that gets past the queue. It is the most any order could fill, however big.</td></tr>
<tr><td class="rh"><i>A</i>(<i>k</i>)</td><td data-label="units">dollars</td><td data-label="what it is">money at risk: the most middle pays, in one window, for what it holds. It comes back about 11 seconds after the close, so the same money is reused every window.</td></tr>
<tr><td class="rh"><i>L</i></td><td data-label="units">dollars</td><td data-label="what it is">Kalshi's position accountability level for these contracts: $25,000 of possible loss per market, per member. It is not a hard cap, but above it Kalshi can ask questions and order us to stop adding or to reduce.</td></tr>
</table></div>

<h3>The model</h3>
<div class="eq"><div class="fml"><i>&#960;</i>(<i>k</i>) = <i>C</i>(<i>k</i>) &#183; <i>e</i>(<i>k</i>)</div><div class="fml"><i>&#928;</i>(<i>k</i>) = <i>N</i> &#183; <i>&#960;</i>(<i>k</i>)</div><div class="fml"><i>C</i>(<i>k</i>) &#8804; min(400<i>k</i>, <i>R</i>),&#8195;<i>R</i> &#8776; <i>V</i> &#8722; <i>Q</i>,&#8195;<i>A</i>(<i>k</i>) &#8804; <i>L</i></div>
<ul class="legend">
<li><b>First line:</b> contracts per window times dollars per contract gives dollars per window.</li>
<li><b>Second line:</b> windows per month times dollars per window gives dollars per month.</li>
<li><b>Third line:</b> the limits. Middle can't fill more than its own cap, nor more than the volume that gets past the queue. Kalshi's level bounds what it holds.</li>
</ul></div>
<p>Everything reduces to two numbers, <i>C</i> and <i>e</i>. <i>C</i> is a question about the market: how much trades where we wait. We can measure it well from the recordings. <i>e</i> is a question about us: whether our side of each trade wins more than it pays. That is the number we are still unsure of.</p>

<h3>What limits <i>C</i></h3>
<p><b>At today's size, our own cap.</b> Middle ends 67% of windows holding its full 400 contracts.</p>
<p><b>Scale up and the queue takes over.</b> Middle only has an order out about 45% of its band (136 of 300 seconds), because it waits for our fair value to disagree with the market by 2¢. When it does join, it lines up at the best price behind about 3,800 contracts (<i>Q</i>). Only trading beyond that line reaches us. Replaying the band with no cap at all (the bot's own quoting and fill code, over the recorded books and trades), even an unlimited order gets about 19,400 contracts a window (<i>R</i>). That is 3.5% of the roughly 556,000 contracts that trade in the band.</p>
<p><b>Kalshi's level binds before that.</b> $25,000 of possible loss is about 25,000 contracts, so <i>k</i> &#8776; 62.</p>
<p><b>Above about <i>k</i> = 30, the market itself becomes the limit.</b> Our order is then bigger than everything displayed at the best price, so other traders would react to it. No replay of the past can show that reaction.</p>

<h3>The numbers</h3>
<p>This is the bot's own quoting and fill code replayed at each size. The first figure in each pair uses this run's 73 windows (18:00 on 18 Sep to 12:00 on 19 Sep). The second uses every recorded window (735, from 11 Sep).</p>

<p>In the replay, <i>e</i> barely falls as the size grows: extra contracts earn about as much as the first ones. Treat that as a best case, because the replay assumes nobody reacts to us (see below).</p>

<h3>Three scenarios</h3>
<ul class="legend">
<li><b>Optimistic:</b> <i>k</i> = 62, fills as simulated, this run's edge. 13,037 &#215; 10.2¢ = $1,333 a window, or about <b>$3.8M a month</b>.</li>
<li><b>Base:</b> <i>k</i> = 30, with 30% fewer fills and a 30% smaller edge than simulated, to allow for what the replay can't see. Those two haircuts are judgment calls, not measurements. 5,950 &#215; 7.3¢ = $434 a window, or about <b>$1.25M a month</b>.</li>
<li><b>Pessimistic:</b> the base case, but starting from the whole history's edge (2.4¢). 5,950 &#215; 1.7¢ = about $100 a window, or about <b>$0.3M a month</b>.</li>
<li><b>If there is no edge:</b> nothing, with drawdowns of around $80,000 at <i>k</i> = 30.</li>
</ul>

<h3>Money and fees</h3>
<p>About $100,000 covers <i>k</i> = 30. That is at most $11,300 at risk in any window, plus room for losing streaks: the replay's worst drawdown at that size was $10,000 in this run and $78,000 over the whole history. <i>k</i> = 62 needs about $150,000. Makers pay nothing on this series; only the side that takes pays the fee (Part 5).</p>

<h3>What the replay cannot see</h3>
<ul class="legend">
<li><b>Sweeps.</b> At 30&#215;, about 45% of the simulated fills come from large orders that swept through our price. A real order that big would absorb the sweep, and change what happens next.</li>
<li><b>Pick-offs.</b> A large order left at a stale price is a target for faster traders.</li>
<li><b>Our own footprint.</b> Our fills move Kalshi's price, which shrinks the 2¢ gap middle waits for.</li>
<li><b>Being stepped ahead of.</b> Below 10¢ and above 90¢, prices move in 0.1¢ steps, so other makers can cheaply step in front of us.</li>
</ul>

<p><b>The bottom line.</b> The market has room for roughly 10 to 30 times today's size before our own orders start changing it. What that size would earn depends almost entirely on <i>e</i>. <i>e</i> is 9 to 10¢ in this run, 1.7¢ over the whole history, and zero in its first half. Nothing here should be scaled on this run's numbers. The 200-window test comes first.</p>

let TIP=null;function showTip(el,x,y){if(!TIP){TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);}TIP.textContent=el.dataset.tip;TIP.hidden=false;const w=TIP.offsetWidth,h=TIP.offsetHeight;let left=x+14,top=y+18;if(left+w>window.innerWidth-8)left=Math.max(8,x-w-14);if(top+h>window.innerHeight-8)top=Math.max(8,y-h-14);TIP.style.left=left+'px';TIP.style.top=top+'px';}
function hideTip(){if(TIP)TIP.hidden=true;}
document.addEventListener('mouseover',e=>{if(e.target.closest&&e.target.closest('svg[data-chart]'))return;const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else hideTip();});document.addEventListener('mousemove',e=>{if(e.target.closest&&e.target.closest('svg[data-chart]'))return;const el=e.target.closest('[data-tip]');if(el&&TIP&&!TIP.hidden)showTip(el,e.clientX,e.clientY);});document.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))hideTip();});document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');if(el&&el.closest('[data-top]'))return;if(el){if(TIP&&!TIP.hidden&&TIP.textContent===el.dataset.tip)hideTip();else showTip(el,e.clientX,e.clientY);}});
async function go(pw){pw=(pw||'').trim();if(!pw){$('#err').textContent='Enter the passphrase.';return;}try{const P=await load(pw);CUR=P;LASTUPD=Date.now();$('#gate').hidden=true;$('#app').hidden=false;try{render(P);restoreScroll(TAB);}catch(e){console.error(e);$('#app').innerHTML='<p class="bad">The data decrypted but the page failed to render: '+(e&&e.message||e)+'</p><p class="small">Reload to try again; this is a page bug, not a passphrase problem.</p>';}sessionStorage.setItem('pw',pw);if($('#rem')&&$('#rem').checked)localStorage.setItem('pw',pw);startLive(pw);setInterval(async()=>{if(MODE!=='live'){try{CUR=await load(pw);render(CUR);}catch(e){}}},60000);}catch(e){console.error(e);$('#err').textContent=(/OperationError|decrypt/i.test(String(e&&e.name||e))?'Wrong passphrase.':'Could not load the data ('+(e&&e.message||e)+'). Is the dashboard server running?');}}
$('#f').addEventListener('submit',e=>{e.preventDefault();go($('#pw').value)});const saved=localStorage.getItem('pw')||sessionStorage.getItem('pw');if(saved)go(saved);
</script></body></html>
